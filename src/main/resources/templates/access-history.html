<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access History</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            height: 65px;
            background: #1e3a8a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .navbar h2 {
            font-size: 21px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #374151;
            padding: 9px 18px;
            border-radius: 6px;
        }

        .container {
            padding: 35px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #6b7280;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            color: #374151;
        }

        td {
            color: #4b5563;
        }

        .allow {
            color: #15803d;
            background: #dcfce7;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
        }

        .denied {
            color: #b91c1c;
            background: #fee2e2;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .container {
                padding: 20px;
            }

            th,
            td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="navbar">

    <h2>🔐 Zero Trust Access System</h2>

    <a href="/dashboard" class="back-btn">
        ← Dashboard
    </a>

</div>

<div class="container">

    <div class="heading">

        <h1>Access History</h1>

        <p>
            Monitor previous resource access decisions.
        </p>

    </div>

    <div class="table-container">

        <table>

            <thead>
            <tr>
                <th>User</th>
                <th>Resource</th>
                <th>Device</th>
                <th>Decision</th>
                <th>Reason</th>
                <th>IP Address</th>
                <th>Time</th>
            </tr>
            </thead>

            <tbody>

                <tr th:each="log : ${logs}">

                    <td th:text="${log.user.name}">
                        User Name
                    </td>
                
                    <td th:text="${log.resource.name}">
                        Resource Name
                    </td>
                
                    <td th:text="${log.device != null ? log.device.deviceName : 'No Device'}">
                        Device Name
                    </td>
                
                    <td>
                        <span th:if="${log.decision == 'ALLOW'}"
                              class="allow">
                            ALLOWED
                        </span>
                
                        <span th:if="${log.decision == 'DENIED'}"
                              class="denied">
                            DENIED
                        </span>
                    </td>
                
                    <td th:text="${log.reason}">
                        Reason
                    </td>
                
                    <td th:text="${log.ipAddress}">
                        IP Address
                    </td>
                
                    <td th:text="${#temporals.format(log.timestamp, 'dd-MM-yyyy HH:mm')}">
                        Time
                    </td>
                
                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
