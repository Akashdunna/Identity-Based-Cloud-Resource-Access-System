<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zero Trust Access System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .security-note {
            margin-top: 25px;
            padding: 12px;
            background: #f0f9ff;
            border-radius: 7px;
            text-align: center;
            color: #0369a1;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">🔐</div>

    <h1>Zero Trust Access</h1>

    <p class="subtitle">
        Identity-Based Cloud Resource Access
    </p>

    <form method="post" action="/login">



            <div th:if="${param.error}"
                 style="color: #dc2626;
                        background: #fee2e2;
                        padding: 10px;
                        border-radius: 6px;
                        margin-bottom: 15px;
                        text-align: center;">
                ❌ Invalid email or password.
            </div>
        
            <div th:if="${param.logout}"
                 style="color: #15803d;
                        background: #dcfce7;
                        padding: 10px;
                        border-radius: 6px;
                        margin-bottom: 15px;
                        text-align: center;">
                ✅ You have been logged out successfully.
            </div>
        


        <label for="username">Email</label>

        <input
                type="email"
                id="username"
                name="username"
                placeholder="Enter your email"
                required
        >

        <label for="password">Password</label>

        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="security-note">
        🛡️ Access is verified based on identity, role and device security.
    </div>

</div>

</body>

</html>
