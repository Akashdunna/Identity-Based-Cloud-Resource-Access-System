<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #b91c1c;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 7px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">🔒</div>

    <h1>Access Denied</h1>

    <p>
        You do not have permission to access this page.
        Please contact the administrator if you believe this is a mistake.
    </p>

    <a href="/dashboard" class="back-btn">
        ← Return to Dashboard
    </a>

</div>

</body>
</html>
